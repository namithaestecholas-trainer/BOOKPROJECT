{% extends 'base.html' %}

{% block title %}Delete Book{% endblock %}

{% block content %}

<h2>Delete Book</h2>

<p>Are you sure you want to delete "{{ book.title }}"?</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit" class="remove-btn">Yes, Delete</button>

    <a href="{% url 'book_list' %}" class="cancel-btn">Cancel</a>
</form>

{% endblock %}
