
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Book</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f5ef;
            color: #26352b;
            margin: 0;
        }

        header {
            background: #234536;
            color: white;
            text-align: center;
            padding: 25px;
            border-bottom: 4px solid #c9a45c;
        }

        .delete-container {
            max-width: 500px;
            width: 90%;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(35, 69, 54, 0.1);
        }

        h2 {
            color: #234536;
        }

        p {
            color: #626b62;
            line-height: 1.7;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .delete-btn {
            background: #b42318;
            color: white;
        }

        .cancel-btn {
            background: #e8efe8;
            color: #234536;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Book Library</h1>
</header>

<div class="delete-container">

    <h2>Delete Book?</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ book.title }}</strong>?
    </p>

    <p>This action cannot be undone.</p>

    <form method="POST">
        {% csrf_token %}

        <div class="buttons">
            <button type="submit" class="btn delete-btn">
                Yes, Delete
            </button>

            <a href="{% url 'book_list' %}"
               class="btn cancel-btn">
                Cancel
            </a>
        </div>
    </form>

</div>

</body>
</html>
