<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f5ef;
            color: #26352b;
            margin: 0;
        }

        header {
            background: #234536;
            color: white;
            text-align: center;
            padding: 30px 15px;
            border-bottom: 4px solid #c9a45c;
        }

        .form-container {
            max-width: 550px;
            width: 90%;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(35, 69, 54, 0.1);
        }

        h2 {
            color: #234536;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
        }

        input:not([type="checkbox"]) {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5d9d2;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #c9a45c;
            border-color: #234536;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .checkbox-row label {
            margin: 0;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .save-btn {
            background: #234536;
            color: white;
        }

        .cancel-btn {
            background: #e8efe8;
            color: #234536;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Book Library</h1>
    <p>Manage Your Book Collection</p>
</header>

<div class="form-container">

    <h2>
        {% if book %}
            Edit Book
        {% else %}
            Add New Book
        {% endif %}
    </h2>

    <form method="POST">
        {% csrf_token %}

        <label for="title">Book Title</label>
        <input type="text" id="title" name="title"
               value="{{ book.title|default:'' }}" required>

        <label for="author">Author</label>
        <input type="text" id="author" name="author"
               value="{{ book.author|default:'' }}" required>

        <label for="price">Price</label>
        <input type="number" id="price" name="price"
               value="{{ book.price|default:'' }}"
               min="0" required>

        <label for="category">Category</label>
        <input type="text" id="category" name="category"
               value="{{ book.category|default:'' }}" required>

        <div class="checkbox-row">
            <input type="checkbox" id="available" name="available"
                   {% if book %}
                       {% if book.available %}checked{% endif %}
                   {% else %}
                       checked
                   {% endif %}>

            <label for="available">Available</label>
        </div>

        <div class="buttons">
            <button type="submit" class="btn save-btn">
                {% if book %}Update Book{% else %}Save Book{% endif %}
            </button>

            <a href="{% url 'book_list' %}"
               class="btn cancel-btn">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
